name: Godot release cleanup

# Deletes the godot-pr-<n> pre-release and its tag when the pull request closes (merged or not),
# so the Windows builds do not pile up.

on:
  pull_request:
    types: [closed]

permissions:
  contents: read

jobs:
  delete-release:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # needed to delete the release and its tag
    steps:
      - name: Delete the PR's Godot release and tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: godot-pr-${{ github.event.pull_request.number }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes --cleanup-tag
          else
            echo "No release named $TAG; nothing to delete."
          fi
