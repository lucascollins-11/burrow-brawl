name: Godot

# Headless GDScript tests, plus a Windows export zip attached to a GitHub Release per pull request.
# Nobody can run Godot in the agent workspaces, so this workflow is the build and test loop.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: godot-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned Godot 4 stable. Keep in sync with godot/README.md.
  GODOT_VERSION: 4.4.1-stable

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Check third-party assets (files, hashes, licenses, credits)
        run: python3 tools/assets/fetch.py check

      - name: Install Godot
        run: |
          set -euo pipefail
          mkdir -p "$HOME/godot-bin"
          curl -fsSL -o godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip -d "$HOME/godot-bin"
          mv "$HOME/godot-bin/Godot_v${GODOT_VERSION}_linux.x86_64" "$HOME/godot-bin/godot"
          chmod +x "$HOME/godot-bin/godot"
          echo "$HOME/godot-bin" >> "$GITHUB_PATH"

      - name: Import project
        run: godot --headless --path godot --import

      - name: Headless tests
        # Runs the core suite, then every godot/tests/*_tests.gd script. Any non-zero exit fails the
        # job. Test output (including BENCH lines) goes to the log as it runs.
        run: |
          status=0
          godot --headless --path godot -s res://tests/run_tests.gd || status=1
          shopt -s nullglob
          for f in godot/tests/*_tests.gd; do
            name="$(basename "$f")"
            echo "::group::$name"
            godot --headless --path godot --script "res://tests/$name" || status=1
            echo "::endgroup::"
          done
          exit "$status"

  # Two Godot clients play one online match against a locally started game server: lobby, start,
  # island decode and meshing, one shot, a crater on both clients, turn passing. Then the same run
  # with a software renderer saves screenshots (best effort) so agents can see the game.
  e2e:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # needed only to attach screenshots to the pull request's release
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build and start the game server
        run: |
          set -euo pipefail
          pnpm --filter @burrow-brawl/server build
          HOST=127.0.0.1 PORT=8080 HEARTBEAT_MS=60000 node server/dist/index.js > server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/healthz >/dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/healthz

      - name: Install Godot
        run: |
          set -euo pipefail
          mkdir -p "$HOME/godot-bin"
          curl -fsSL -o godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip -d "$HOME/godot-bin"
          mv "$HOME/godot-bin/Godot_v${GODOT_VERSION}_linux.x86_64" "$HOME/godot-bin/godot"
          chmod +x "$HOME/godot-bin/godot"
          echo "$HOME/godot-bin" >> "$GITHUB_PATH"

      - name: Import project
        run: godot --headless --path godot --import

      - name: Online match, headless
        run: |
          set -euo pipefail
          godot --headless --path godot res://tests/e2e/e2e_match.tscn -- --server=http://127.0.0.1:8080 2>&1 | tee e2e.log
          # Engine errors (for example a data race in the threaded mesher) must fail the job even
          # when the match itself completes.
          # Only up to "E2E PASS": the engine also prints harmless leak notices while quitting.
          if sed "/E2E PASS/q" e2e.log | grep -n "^ERROR:\|SCRIPT ERROR"; then
            echo "The engine reported errors during the match"
            exit 1
          fi

      - name: Agent playtest harness, headless smoke scenario
        # The harness Claude sessions use to play the game (docs/agent-playtest.md). Exits 1 when a
        # step fails; engine errors before PLAYTEST DONE fail the job too.
        run: |
          set -euo pipefail
          timeout 300 godot --headless --path godot res://tests/playtest/playtest.tscn -- \
            --server=http://127.0.0.1:8080 --scenario=res://tests/playtest/scenarios/smoke.json \
            --out="$PWD/playtest-smoke" 2>&1 | tee playtest.log
          if sed "/PLAYTEST DONE/q" playtest.log | grep -n "^ERROR:\|SCRIPT ERROR"; then
            echo "The engine reported errors during the playtest"
            exit 1
          fi

      - name: Same match against the live server (probe, best effort)
        continue-on-error: true
        run: |
          timeout 240 godot --headless --path godot res://tests/e2e/e2e_match.tscn -- --server=https://burrow-brawl.onrender.com 2>&1 | tee live.log || true
          tail -n 40 live.log

      - name: Online match with screenshots (software renderer, best effort)
        continue-on-error: true
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb mesa-vulkan-drivers libvulkan1 > /dev/null
          mkdir -p shots
          timeout 600 xvfb-run -a -s "-screen 0 1280x720x24" \
            godot --path godot --rendering-driver vulkan --resolution 1280x720 \
            res://tests/e2e/e2e_match.tscn -- --server=http://127.0.0.1:8080 --shots="$PWD/shots" 2>&1 | tee render.log
          ls -la shots

      - name: Map tour, Bathtub Bay (software renderer, best effort)
        continue-on-error: true
        run: |
          mkdir -p shots
          timeout 420 xvfb-run -a -s "-screen 0 1280x720x24" \
            godot --path godot --rendering-driver vulkan --resolution 1280x720 \
            res://tests/e2e/e2e_match.tscn -- --server=http://127.0.0.1:8080 --shots="$PWD/shots" --theme=bathtub-bay --tour 2>&1 | tail -n 20

      - name: Shaders compiled in the rendered run
        run: |
          if [ ! -f render.log ]; then echo "no rendered run"; exit 0; fi
          if grep -n "SHADER ERROR\|Shader compilation failed" render.log; then
            grep -n -A12 "SHADER ERROR" render.log | head -80
            exit 1
          fi
          echo "no shader errors"

      - name: Map tour, Garden Patch (software renderer, best effort)
        continue-on-error: true
        run: |
          mkdir -p shots
          timeout 420 xvfb-run -a -s "-screen 0 1280x720x24" \
            godot --path godot --rendering-driver vulkan --resolution 1280x720 \
            res://tests/e2e/e2e_match.tscn -- --server=http://127.0.0.1:8080 --shots="$PWD/shots" --theme=garden-patch --tour 2>&1 | tail -n 20

      - name: Agent playtest, tutorial with screenshots (software renderer, best effort)
        continue-on-error: true
        run: |
          timeout 600 xvfb-run -a -s "-screen 0 1280x720x24" \
            godot --path godot --rendering-driver vulkan --resolution 1280x720 \
            res://tests/playtest/playtest.tscn -- --server=http://127.0.0.1:8080 \
            --scenario=res://tests/playtest/scenarios/tutorial.json --out="$PWD/playtest-tutorial" 2>&1 | grep "^PLAYTEST" || true

      - name: Upload playtest reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playtest-reports
          path: |
            playtest-smoke
            playtest-tutorial
          if-no-files-found: ignore

      - name: Server log
        if: always()
        run: tail -n 60 server.log || true

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: shots
          if-no-files-found: ignore

      - name: Attach screenshots to the pull request's release
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(shots/*.png)
          [ ${#files[@]} -gt 0 ] || { echo "no screenshots"; exit 0; }
          TAG="godot-pr-${PR_NUMBER}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --prerelease --target "$HEAD_SHA" \
              --title "Godot build for PR #${PR_NUMBER}" \
              --notes "Windows build from pull request #${PR_NUMBER}. Replaced on every push to the PR." || true
          fi
          gh release upload "$TAG" "${files[@]}" --clobber

  export-windows:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write # needed only to attach the build to a release
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install Godot
        run: |
          set -euo pipefail
          mkdir -p "$HOME/godot-bin"
          curl -fsSL -o godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip -d "$HOME/godot-bin"
          mv "$HOME/godot-bin/Godot_v${GODOT_VERSION}_linux.x86_64" "$HOME/godot-bin/godot"
          chmod +x "$HOME/godot-bin/godot"
          echo "$HOME/godot-bin" >> "$GITHUB_PATH"

      - name: Install export templates
        run: |
          set -euo pipefail
          curl -fsSL -o templates.tpz \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          mkdir -p templates-tmp
          unzip -q templates.tpz -d templates-tmp
          # Godot looks for templates in a folder named like the version: 4.4.1.stable
          TDIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION/-/.}"
          mkdir -p "$TDIR"
          mv templates-tmp/templates/* "$TDIR/"

      - name: Import project
        run: godot --headless --path godot --import

      - name: Export Windows build
        run: |
          set -euo pipefail
          mkdir -p build
          godot --headless --path godot --export-release "Windows Desktop" "$GITHUB_WORKSPACE/build/BurrowBrawl.exe"
          test -s build/BurrowBrawl.exe
          (cd build && zip -q BurrowBrawl-windows.zip BurrowBrawl.exe)

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: BurrowBrawl-windows
          path: build/BurrowBrawl-windows.zip
          if-no-files-found: error

      - name: Attach build to the pull request's release
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          TAG="godot-pr-${PR_NUMBER}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --prerelease --target "$HEAD_SHA" \
              --title "Godot build for PR #${PR_NUMBER}" \
              --notes "Windows build from pull request #${PR_NUMBER}. Replaced on every push to the PR."
          fi
          gh release upload "$TAG" build/BurrowBrawl-windows.zip --clobber

      - name: Publish the playtest build (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="playtest"
          NOTES="Latest Windows build of the main branch (commit ${GITHUB_SHA::7}). Replaced on every merge. Download BurrowBrawl-windows.zip, extract it, run BurrowBrawl.exe. See docs/playtest.md."
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --prerelease --target "$GITHUB_SHA" --title "Burrow Brawl playtest build" --notes "$NOTES"
          else
            gh release edit "$TAG" --notes "$NOTES"
          fi
          gh release upload "$TAG" build/BurrowBrawl-windows.zip --clobber
