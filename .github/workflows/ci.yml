name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  # Production-shape smoke test: server bundle run standalone with NODE_ENV=production,
  # ALLOWED_ORIGINS and a JWT secret; client built with VITE_GAME_SERVER_URL and hosted
  # statically on another origin; two browsers play through lobby, match and one shot.
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build the Render image
        run: docker build -f Dockerfile -t burrow-brawl-server .

      - name: Run the Render image and check /healthz
        run: |
          docker run -d --name bb-server -p 3000:3000 \
            -e JWT_SECRET="$(openssl rand -base64 48)" \
            -e ALLOWED_ORIGINS=http://127.0.0.1:4173 \
            burrow-brawl-server
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/healthz; then echo; docker stop bb-server; exit 0; fi
            sleep 1
          done
          docker logs bb-server
          exit 1

      - name: Smoke test (two browsers, lobby to first shot)
        run: pnpm smoke
